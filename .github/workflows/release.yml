name: Release to testers

# Builds a signed App Bundle and pushes it to the Play Console internal testing
# track, and builds a signed IPA and uploads it to TestFlight. Setup (the secrets
# and variables below, and the one manual first upload Play insists on) is in
# docs/RELEASING.md.
#
# Adapted from the release workflow in amitrke/relay-player, whose iOS job signs
# with Apple's cloud-managed signing using only an App Store Connect API key.
#
# One workflow for both stores so one push ships both and the same build number
# is used on both: Play's versionCode and iOS's CFBundleVersion match for the
# same commit. Renaming or recreating this *file* restarts github.run_number,
# which both stores would reject until it passed their highest build.
on:
  workflow_dispatch:
    inputs:
      status:
        description: >-
          Release status. "completed" rolls out to internal testers at once;
          "draft" leaves it in Play Console to roll out by hand.
        type: choice
        options: [completed, draft]
        default: completed
      platforms:
        description: Which stores this run ships to.
        type: choice
        options: [both, android, ios]
        default: both
  push:
    branches: [develop]
    tags: ['v*']

concurrency:
  # Never cancel: a run killed mid-upload leaves an open Play edit behind.
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.0'
  PACKAGE_NAME: com.subnext.voicenotes
  # Added to github.run_number. The first bundle was built and uploaded to Play
  # by hand with versionCode 1, and a store rejects a build number it has seen.
  BUILD_NUMBER_OFFSET: 100

jobs:
  check:
    name: Analyse and test
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.version.outputs.code }}
      name: ${{ steps.version.outputs.name }}
      release_name: ${{ steps.version.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          name="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::pubspec.yaml's version '$name' is not of the form 1.2.3"
            exit 1
          fi
          if [ "${{ github.ref_type }}" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$name" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml's version $name."
              exit 1
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/v$name" >/dev/null 2>&1; then
            echo "::error::v$name has already been released. Bump pubspec.yaml's version."
            exit 1
          fi
          code=$(( ${{ github.run_number }} + BUILD_NUMBER_OFFSET ))
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "release_name=$name ($code)" >> "$GITHUB_OUTPUT"
          echo "Version $name ($code)"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  bundle:
    name: Build and upload AAB
    needs: check
    # Repository variable RELEASE_ANDROID = 'false' skips Play; unset means on.
    if: vars.RELEASE_ANDROID != 'false' && (inputs.platforms || 'both') != 'ios'
    runs-on: ubuntu-latest
    env:
      HAS_PLAY_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # Written outside the checkout and removed at the end whatever happens.
      - name: Install the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          # A variable, not a secret: the alias is not sensitive, and a secret's
          # value is masked everywhere it appears in the logs.
          KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty: its secret (or, for KEY_ALIAS, the repository variable) is not set. See docs/RELEASING.md."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          cat > android/key.properties <<EOF
          storeFile=$keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: >-
          flutter build appbundle --release
          --build-number=${{ needs.check.outputs.code }}
          --build-name=${{ needs.check.outputs.name }}

      # build.gradle.kts falls back to the debug key when key.properties is
      # unreadable. That must never reach a store.
      - name: Refuse a debug-signed bundle
        run: |
          aab=build/app/outputs/bundle/release/app-release.aab
          cert="$(keytool -printcert -jarfile "$aab" 2>&1)" || true
          if [ -z "$cert" ] || grep -q 'Not a signed jar file' <<< "$cert"; then
            echo "::error::$aab is not signed"; exit 1
          fi
          if grep -q 'CN=Android Debug' <<< "$cert"; then
            echo "::error::$aab is signed with the debug key"; exit 1
          fi
          grep -E 'SHA256:' <<< "$cert"

      # Kept whether or not the upload runs. Play's API cannot create an app's
      # first release, so a first bundle may have to be uploaded by hand.
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ needs.check.outputs.code }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Play internal testing
        if: env.HAS_PLAY_CREDENTIALS == 'true'
        # Pinned to a commit (v1.1.5), not a tag the action's owner can move:
        # this step is handed a service-account key.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          releaseName: ${{ needs.check.outputs.release_name }}
          tracks: internal
          status: ${{ inputs.status || 'completed' }}

      - name: Note the skipped upload
        if: env.HAS_PLAY_CREDENTIALS != 'true'
        run: >-
          echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set, so the bundle
          was built and kept as an artifact but not uploaded. See
          docs/RELEASING.md."

      - name: Remove the upload key
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"

  ios:
    name: Build and upload IPA
    needs: check
    if: vars.RELEASE_IOS != 'false' && (inputs.platforms || 'both') != 'android'
    # macOS runners are free for a public repository.
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HAS_ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 != '' }}
      ASC_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      # App Store Connect rejects uploads built with an SDK older than Apple's
      # current minimum, and the runner's default Xcode can lag.
      - name: Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Install the App Store Connect API key
        if: env.HAS_ASC_KEY == 'true'
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty: its repository variable is not set. See docs/RELEASING.md."
              exit 1
            fi
          done
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir"
          key="$dir/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$P8" > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      # Without the key there is no way to sign, but the run still proves the
      # iOS build compiles, which nothing else in CI checks.
      - name: Compile without signing
        if: env.HAS_ASC_KEY != 'true'
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ needs.check.outputs.code }} \
            --build-name=${{ needs.check.outputs.name }}
          echo "::notice::APP_STORE_CONNECT_API_KEY_P8 is not set, so the iOS build was compiled but not signed or uploaded."

      # flutter build ipa cannot pass an API key to xcodebuild, so Flutter only
      # generates the Xcode configuration and xcodebuild archives itself, with
      # -allowProvisioningUpdates and the key. Cloud-managed signing needs the
      # key to have the Admin role.
      - name: Archive
        if: env.HAS_ASC_KEY == 'true'
        run: |
          flutter build ios --release --config-only \
            --build-number=${{ needs.check.outputs.code }} \
            --build-name=${{ needs.check.outputs.name }}
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -n 40
          # tail hides xcodebuild's exit status; the archive's presence is the check.
          test -d "$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app"
          /usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' \
            "$RUNNER_TEMP/Runner.xcarchive/Info.plist"

      # ios/ExportOptions.plist sets destination=upload, so this step both signs
      # for distribution and sends the build. Its exit status is the result.
      - name: Export and upload to TestFlight
        if: env.HAS_ASC_KEY == 'true'
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -n 40

      - name: Remove the API key
        if: always()
        run: rm -rf "$HOME/.appstoreconnect/private_keys"
